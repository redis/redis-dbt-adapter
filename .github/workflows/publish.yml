name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release distributions
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download and verify the published release assets
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq .draft)" = false
          mkdir dist
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern 'dbt_redis_adbc-*.whl' \
            --pattern 'dbt_redis_adbc-*.tar.gz' --pattern SHA256SUMS
          python3 scripts/verify_release.py "$RELEASE_TAG" dist
          rm dist/SHA256SUMS
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Check package metadata and README rendering
        run: uvx --python 3.13 twine==7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish verified distributions
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dbt-redis-adbc/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish through the PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1

