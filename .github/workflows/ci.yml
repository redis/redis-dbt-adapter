name: CI

# Every PR, push, nightly run and release validation uses the latest published
# Redis ADBC driver release for the whole project, demos and adapter tests.
on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to validate
        type: string
        required: true
      wheel_artifact:
        description: Artifact from this run containing the built release wheel
        type: string
        required: true
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    name: Python dependency security audit (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Export locked runtime and test dependencies
        working-directory: v1
        run: uv export --locked --all-groups --no-emit-project --no-emit-package dbt-redis-adbc --no-hashes --output-file "$RUNNER_TEMP/v1-requirements.txt"
      - name: Audit both Python runtimes
        run: |
          uvx --python ${{ matrix.python }} pip-audit==2.10.1 --no-deps --disable-pip -r "$RUNNER_TEMP/v1-requirements.txt"
          uvx --python ${{ matrix.python }} pip-audit==2.10.1 --no-deps --disable-pip -r v2/requirements-python.txt

  # Fast runner tests; the pinned native engine has a separate manual workflow.
  v2-harness:
    name: v2 smoke runner tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Test the v2 smoke runner without v1 dependencies
        run: |
          uv run --no-project --python 3.13 python -m unittest discover -s v2/tests -v
          if [ -d scripts/tests ]; then
            uv run --no-project --python 3.13 python -m unittest discover -s scripts/tests -v
          fi

      - name: Test the microbatch failure boundary and recovery checks
        run: uv run --no-project --python 3.13 python -m unittest discover -s v1/scripts/tests -v

  project:
    name: project (Python ${{ matrix.python }}, ${{ matrix.versions }} dbt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v1
    env:
      # Without the dev group (dbt-tests-adapter, pytest), which needs a newer
      # dbt-common than the oldest dbt-core allows.
      UV_NO_DEV: "1"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
        # locked: uv.lock. oldest: the lowest versions the pyproject.toml
        # files allow (the project's dbt-core, the adapter's other floors).
        versions: [locked, oldest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Provision Redis Enterprise with TLS and a named user
        run: python3 ../scripts/redis_enterprise.py up --github-env

      - name: Require authenticated Redis Enterprise over TLS
        run: python3 ../scripts/integration_config.py

      - uses: astral-sh/setup-uv@v10.2.0 # no major-version tags
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: v1/uv.lock

      - name: Install the dependencies
        run: |
          uv sync --locked

      - name: Install the oldest versions
        if: matrix.versions == 'oldest'
        run: |
          uv pip install dbt-core==1.10.8 dbt-adapters==1.16.0 adbc-driver-manager==1.6.0 pyarrow==26.0.0
          # Otherwise `uv run` syncs back to uv.lock.
          echo UV_NO_SYNC=1 >> "$GITHUB_ENV"

      - name: Download the release wheel
        if: inputs.wheel_artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.wheel_artifact }}
          path: ${{ runner.temp }}/release-dist
      - name: Download the wheel validation helper
        if: inputs.wheel_artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: release-validation-tools
          path: ${{ runner.temp }}/release-tools
      - name: Install and verify the built wheel
        if: inputs.wheel_artifact != ''
        run: |
          uv pip install --no-deps --reinstall "$RUNNER_TEMP"/release-dist/*.whl
          uv run --no-sync python "$RUNNER_TEMP/release-tools/check_wheel_install.py" "$RUNNER_TEMP/release-dist"
          echo UV_NO_SYNC=1 >> "$GITHUB_ENV"

      - name: Choose the latest driver release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use REST for public cross-repository reads with the workflow token.
          version="$(gh api repos/redis/redis-adbc-driver/releases/latest --jq .tag_name)"
          echo "DRIVER_VERSION=${version}" >> "$GITHUB_ENV"

      # The public driver repository uses the workflow token for release API
      # requests; source builds clone the public repository.
      - name: Download the driver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          make driver

      - name: Install dbt packages
        run: uv run dbt deps

      - name: Cache the trips CSV
        uses: actions/cache@v6
        with:
          path: v1/data
          key: nyc-tlc-yellow-2019-01

      - name: Download the trips CSV
        run: make data

      # make all, with the build's results checked before docs replaces them.
      # The warning is the intended total_amount source test.
      - name: make all
        run: |
          make debug seed load build
          ./scripts/ci_check.py results --pass 82 --warn 1
          make docs

      - name: make incremental-demo
        run: ./scripts/ci_check.py demo incremental-demo

      - name: make snapshot-demo
        run: ./scripts/ci_check.py demo snapshot-demo

      - name: make microbatch-demo
        run: ./scripts/ci_check.py demo microbatch-demo

      - name: Reader visibility and recovery after interrupted microbatch
        run: make microbatch-failure-demo

      - name: dbt build --empty
        run: |
          uv run dbt build --empty --exclude-resource-type snapshot
          ./scripts/ci_check.py results --pass 82

      - name: Upload the dbt logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-logs-${{ matrix.python }}-${{ matrix.versions }}
          path: |
            v1/logs/
            v1/target/run_results.json
          if-no-files-found: ignore

  # dbt's adapter test suite, on the locked versions only: dbt-tests-adapter
  # needs newer dbt packages than the oldest ones.
  adapter-tests:
    name: adapter tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v1
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Provision Redis Enterprise with TLS and a named user
        run: python3 ../scripts/redis_enterprise.py up --github-env

      - name: Require authenticated Redis Enterprise over TLS
        run: python3 ../scripts/integration_config.py

      - uses: astral-sh/setup-uv@v10.2.0 # no major-version tags
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: v1/uv.lock

      - name: Install the dependencies
        run: uv sync --locked

      - name: Download the release wheel
        if: inputs.wheel_artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.wheel_artifact }}
          path: ${{ runner.temp }}/release-dist
      - name: Download the wheel validation helper
        if: inputs.wheel_artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: release-validation-tools
          path: ${{ runner.temp }}/release-tools
      - name: Install and verify the built wheel
        if: inputs.wheel_artifact != ''
        run: |
          uv pip install --no-deps --reinstall "$RUNNER_TEMP"/release-dist/*.whl
          uv run --no-sync python "$RUNNER_TEMP/release-tools/check_wheel_install.py" "$RUNNER_TEMP/release-dist"
          echo UV_NO_SYNC=1 >> "$GITHUB_ENV"

      - name: Choose the latest driver release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use REST for public cross-repository reads with the workflow token.
          version="$(gh api repos/redis/redis-adbc-driver/releases/latest --jq .tag_name)"
          echo "DRIVER_VERSION=${version}" >> "$GITHUB_ENV"

      # The public driver repository uses the workflow token for release API
      # requests; source builds clone the public repository.
      - name: Download the driver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          make driver

      - name: Test connection configuration without a server
        run: uv run pytest adapter/tests/unit -q

      - name: make adapter-tests
        run: make adapter-tests

      - name: Upload the dbt logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: adapter-tests-logs-${{ matrix.python }}
          path: v1/logs/
          if-no-files-found: ignore
