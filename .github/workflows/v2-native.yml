name: Native dbt v2 parity

on:
  workflow_dispatch:
    inputs:
      taxi:
        description: Run the full taxi project and demos (downloads the TLC CSV)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  redis-native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_LOG: trace
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Provision Redis Enterprise with TLS and a named user
        run: python3 scripts/redis_enterprise.py up --github-env

      - name: Require authenticated Redis Enterprise over TLS
        run: python3 scripts/integration_config.py

      - name: Read pinned sources
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          data = json.loads(Path("v2/upstream.json").read_text())
          commit = data["implementation_commit"]
          assert re.fullmatch(r"[0-9a-f]{40}", commit), "Engine commit must be pinned"
          release = subprocess.check_output(
              ["bash", "v1/scripts/resolve_driver_version.sh"], text=True,
              env={**os.environ, "DRIVER_VERSION": data["driver_version"]},
          ).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"engine_commit={commit}", file=output)
              print(f"driver_version={release}", file=output)
          PY

      - uses: actions/checkout@v7
        with:
          repository: alberttwong/dbt
          ref: ${{ steps.sources.outputs.engine_commit }}
          path: engine
          persist-credentials: false

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libssl-dev protobuf-compiler

      - name: Build pinned Redis engine
        working-directory: engine
        run: |
          rustup show
          cargo build -p dbt-sa-cli

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Install optional native Python runtime (without the v1 adapter)
        run: |
          uv venv .venv-v2 --python 3.14
          uv pip install --python .venv-v2/bin/python -r v2/requirements-python.txt
          echo "$GITHUB_WORKSPACE/.venv-v2/bin" >> "$GITHUB_PATH"

      - name: Test local Arrow runtime
        run: .venv-v2/bin/python -m unittest discover -s engine/crates/dbt-adapter/tests/python -v

      - name: Download latest Redis ADBC driver release
        env:
          GH_TOKEN: ${{ github.token }}
          DRIVER_VERSION: ${{ steps.sources.outputs.driver_version }}
        run: bash v1/scripts/download_driver.sh

      - name: Run native smoke without the Python v1 adapter
        env:
          REDIS_ADBC_DRIVER: ${{ github.workspace }}/v1/driver/libadbc_driver_redis.so
        run: python3 v2/smoke.py --dbt "$GITHUB_WORKSPACE/engine/target/debug/dbt" --build

      - name: Audit the native Rust ADBC API and concurrent connections
        working-directory: engine
        env:
          REDIS_ADBC_DRIVER: ${{ github.workspace }}/v1/driver/libadbc_driver_redis.so
        run: cargo test -p dbt-adapter-engine --test redis_adbc -- --ignored

      - name: Run native feature parity
        env:
          REDIS_ADBC_DRIVER: ${{ github.workspace }}/v1/driver/libadbc_driver_redis.so
        run: python3 v2/parity.py --dbt "$GITHUB_WORKSPACE/engine/target/debug/dbt"

      - name: Validate credential precedence over TLS on Redis Enterprise
        env:
          REDIS_ADBC_DRIVER: ${{ github.workspace }}/v1/driver/libadbc_driver_redis.so
        run: |
          REDIS_URI="$(python3 - <<'PYURI'
          import os
          from urllib.parse import urlsplit, urlunsplit
          uri = urlsplit(os.environ["REDIS_URI"])
          print(urlunsplit(uri._replace(netloc="wrong:incorrect-uri-password@" + uri.netloc.rsplit("@", 1)[-1])))
          PYURI
          )"
          export REDIS_URI
          python3 v2/smoke.py --dbt "$GITHUB_WORKSPACE/engine/target/debug/dbt" --build

      - name: Download taxi data
        if: inputs.taxi
        run: bash v1/scripts/download_data.sh

      - name: Run full taxi project and demos
        if: inputs.taxi
        env:
          REDIS_ADBC_DRIVER: ${{ github.workspace }}/v1/driver/libadbc_driver_redis.so
        run: python3 v2/taxi.py --dbt "$GITHUB_WORKSPACE/engine/target/debug/dbt" --csv "$GITHUB_WORKSPACE/v1/data/yellow_tripdata_2019-01.csv.gz"

      - name: Record resolved versions and binary identity
        if: always()
        env:
          ENGINE_COMMIT: ${{ steps.sources.outputs.engine_commit }}
          DRIVER_RELEASE: ${{ steps.sources.outputs.driver_version }}
        run: |
          python3 - <<'PY'
          import hashlib, importlib.metadata, json, os, platform, subprocess
          from pathlib import Path
          binary = Path("engine/target/debug/dbt")
          versions = {
              "engine_commit": os.environ["ENGINE_COMMIT"],
              "driver_release": os.environ["DRIVER_RELEASE"],
              "integration_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "platform": platform.platform(),
          }
          if binary.exists():
              versions["dbt_version"] = subprocess.check_output([str(binary), "--version"], text=True).strip()
              versions["dbt_sha256"] = hashlib.sha256(binary.read_bytes()).hexdigest()
          for package in ("pyarrow", "adbc-driver-manager"):
              try:
                  versions[package] = importlib.metadata.version(package)
              except importlib.metadata.PackageNotFoundError:
                  pass
          Path(os.environ["RUNNER_TEMP"], "native-versions.json").write_text(json.dumps(versions, indent=2) + "\n")
          PY
      - name: Retain native version and dependency provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-validation-provenance
          path: |
            ${{ runner.temp }}/native-versions.json
            engine/Cargo.lock
          if-no-files-found: warn
