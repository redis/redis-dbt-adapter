name: Native v2 Flight SQL qualification

on:
  workflow_dispatch:
    inputs:
      compare_stable:
        description: Also qualify latest stable separately from latest driver main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ fromJSON(inputs.compare_stable && '["stable", "main"]' || '["main"]') }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      GOFLAGS: -p=2
      RUST_LOG: trace
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the native engine base
        id: engine
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          commit = json.loads(Path('v2/upstream.json').read_text())['implementation_commit']
          assert re.fullmatch('[0-9a-f]{40}', commit)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('commit=' + commit, file=output)
          PY
      - uses: actions/checkout@v7
        with:
          repository: alberttwong/dbt
          ref: ${{ steps.engine.outputs.commit }}
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: redis/redis-apache-arrow-flight
          ref: e4dcbd37322536f73ef923e0ab4b76a1abf3d4dc
          path: flight
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: flight/go.mod
          cache-dependency-path: flight/go.sum
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Install the separate Flight client and Arrow runtime
        run: |
          uv venv .venv-flight --python 3.13
          uv pip install --python .venv-flight/bin/python -r v2/requirements-flight.txt
          echo "$GITHUB_WORKSPACE/.venv-flight/bin" >> "$GITHUB_PATH"
      - name: Install engine build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libssl-dev protobuf-compiler
      - name: Test qualification fixtures
        run: python3 -m unittest discover -s v2/tests -v
      - name: Apply and build the experimental engine patch
        run: |
          python3 v2/apply_engine_patch.py --engine engine
          python3 -m unittest discover -s engine/crates/dbt-adapter/tests/python -v
          cd engine
          cargo build -p dbt-sa-cli
          cargo test -p dbt-auth --lib redis_adbc
          cargo test -p dbt-schemas --lib redis_adbc_tests
          cargo test -p dbt-adapter --lib redis
          cargo test -p dbt-adapter-engine --lib retry::redis
      - name: Provision and verify Enterprise TLS, auth, Search and QPF 4x
        run: python3 scripts/redis_enterprise.py up --github-env
      - name: Record verified backend versions
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import redis_enterprise as fixture
          credentials = json.loads((fixture.STATE / 'credentials.json').read_text())
          api = fixture.API(credentials)
          fixture.verify(credentials, api)
          client = fixture.Redis()
          try:
              client.call('AUTH', credentials['username'], credentials['password'])
              info = client.call('INFO', 'server')
          finally:
              client.close()
          database = api.call('GET', 'bdbs')[0]
          evidence = {
              'redis_info': [line for line in info.splitlines() if line.startswith(('redis_version:', 'redis_mode:'))],
              'image': fixture.IMAGE, 'topology_verified': True,
              'shards_count': database['shards_count'], 'tls_mode': database['tls_mode'],
              'query_performance_factor': database['query_performance_factor'],
          }
          Path('backend.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Rebuild Flight with the resolved driver and qualify native v2
        env:
          GH_TOKEN: ${{ github.token }}
          DRIVER_CHANNEL: ${{ matrix.driver }}
        run: |
          export FLIGHT_SQL_USERNAME="$REDIS_USERNAME" FLIGHT_SQL_PASSWORD="$REDIS_PASSWORD"
          export FLIGHT_SQL_TLS_CA_FILE="$REDIS_TLS_CA_FILE"
          args=()
          if [ "$DRIVER_CHANNEL" = main ]; then args+=(--driver-ref main); fi
          python3 v2/qualify_flight.py --dbt "$PWD/engine/target/debug/dbt" \
            --engine-source engine --server-source flight --output-dir "$RUNNER_TEMP/v2-flight" \
            --tls-cert .redis-enterprise/server.crt --tls-key .redis-enterprise/server.key \
            --backend-evidence backend.json "${args[@]}"
      - name: Retain qualification receipts and dependency lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-v2-flight-${{ matrix.driver }}
          path: |
            ${{ runner.temp }}/v2-flight
            engine/Cargo.lock
            backend.json
          if-no-files-found: warn
