# Proposed Redis v2 profile contract. Requires the Rust adapter in the dbt fork.
redis_dbt_v2_smoke:
  target: smoke
  outputs:
    smoke:
      type: redis_adbc
      driver: "{{ env_var('REDIS_ADBC_DRIVER', '') }}"
      uri: "{{ env_var('REDIS_URI') }}"
      username: "{{ env_var('REDIS_USERNAME') }}"
      driver_options:
        adbc.redis.tls_ca_file: "{{ env_var('REDIS_TLS_CA_FILE', '') }}"
      password: "{{ env_var('REDIS_PASSWORD') }}"
      database: redis
      schema: "{{ env_var('REDIS_DBT_V2_SCHEMA') }}"
      threads: 2
      aggregate_pushdown: exact
      rename_rekey: false
      read_timeout: 30
      write_timeout: "30s"
      driver_options:
        adbc.redis.stream_results: true
