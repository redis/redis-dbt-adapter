[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "dbt-redis-adbc"
version = "0.1.0"
description = "dbt adapter for Redis 8.x using the Redis ADBC driver"
readme = "README.md"
authors = [{ name = "Albert T. Wong" }]
keywords = ["dbt", "redis", "adbc", "analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
]
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.10,<2",
    "dbt-adapters>=1.16,<2",
    "adbc-driver-manager>=1.6,<2",
    "pyarrow>=26,<27",
]

[project.urls]
Homepage = "https://github.com/redis/redis-dbt-adapter"
Documentation = "https://github.com/redis/redis-dbt-adapter/blob/main/v1/README.md#adapter-reference"
Issues = "https://github.com/redis/redis-dbt-adapter/issues"
Source = "https://github.com/redis/redis-dbt-adapter/tree/main/v1/adapter"

[tool.hatch.build.targets.wheel]
packages = ["dbt"]
